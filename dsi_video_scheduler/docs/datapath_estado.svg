  <text x="305.0" y="1896.0" fill="#172b4d" font-family="Helvetica, Arial, sans-serif" font-size="19" text-anchor="middle">3: overflow; 4: plazo; 5: evento ilegal</text>
  <text x="305.0" y="1922.0" fill="#172b4d" font-family="Helvetica, Arial, sans-serif" font-size="19" text-anchor="middle">6: contador; 7: marcas; 8: fuente</text>
  <text x="305.0" y="1948.0" fill="#172b4d" font-family="Helvetica, Arial, sans-serif" font-size="19" text-anchor="middle">FAULT_REQ; CAUSE[4]</text>
