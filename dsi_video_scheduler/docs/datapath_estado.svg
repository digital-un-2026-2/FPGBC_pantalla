  <text x="895.0" y="2283.0" fill="#172b4d" font-family="Helvetica, Arial, sans-serif" font-size="19" text-anchor="middle">FRONTERA CON UC · FSM EN PÁGINAS 7–8</text>
  <text x="895.0" y="2309.0" fill="#172b4d" font-family="Helvetica, Arial, sans-serif" font-size="19" text-anchor="middle">Entradas: released, late, event_legal, BCNT/WC, LINE/HEIGHT, seen_next, FAULT_REQ y autorización.</text>
  <text x="895.0" y="2335.0" fill="#172b4d" font-family="Helvetica, Arial, sans-serif" font-size="19" text-anchor="middle">Salidas: START_ACCEPT, FRAME_BEGIN, EVENT_LOAD/ADVANCE, G, cmd_valid, RGB_COMPLETE, FRAME_COMPLETE.</text>
  <text x="895.0" y="2361.0" fill="#172b4d" font-family="Helvetica, Arial, sans-serif" font-size="19" text-anchor="middle">RGB_COMPLETE: UC emite una vez al comprobar paquete+HS completos y BCNT==WC sin fallo.</text>
  <text x="895.0" y="2387.0" fill="#172b4d" font-family="Helvetica, Arial, sans-serif" font-size="19" text-anchor="middle">FRAME_COMPLETE: END liberado, todas las líneas+fuente completas, enlace libre y sin fallo. Emitir una vez.</text>
  <text x="895.0" y="2413.0" fill="#172b4d" font-family="Helvetica, Arial, sans-serif" font-size="19" text-anchor="middle">STOP conserva el nivel hasta terminar cuadro. Ante fallo, bloquear nuevos paquetes y exigir reset coordinado.</text>
  <text x="895.0" y="2439.0" fill="#172b4d" font-family="Helvetica, Arial, sans-serif" font-size="19" text-anchor="middle">Un fallo del planificador no conmuta directamente pads ni borra el diagnóstico del wrapper Gowin.</text>
