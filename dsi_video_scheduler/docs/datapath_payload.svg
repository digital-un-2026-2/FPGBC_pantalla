  <text x="60" y="65.5" fill="#172b4d" font-family="Helvetica, Arial, sans-serif" font-size="28" text-anchor="start">DATAPATH 3/4 · BYTES, LÍNEAS Y CADENA DSI</text>
  <text x="60" y="143.0" fill="#172b4d" font-family="Helvetica, Arial, sans-serif" font-size="19" text-anchor="start">Los bloques DSI existentes son externos al planificador. No duplicar su RAM, ECC, CRC ni serializadores.</text>
  <text x="60" y="169.0" fill="#172b4d" font-family="Helvetica, Arial, sans-serif" font-size="19" text-anchor="start">El planificador cuenta bytes aceptados por el preparador; el fin físico se supervisa en la siguiente página.</text>
  <text x="60" y="2778.0" fill="#172b4d" font-family="Helvetica, Arial, sans-serif" font-size="19" text-anchor="start">PROPUESTA · Registros en ↑clk; rst síncrono prioritario. LD=0 conserva Q.</text>
  <text x="60" y="2804.0" fill="#172b4d" font-family="Helvetica, Arial, sans-serif" font-size="19" text-anchor="start">Buses [n]; controles discontinuos. Redes con el mismo nombre se conectan entre páginas. Ecuaciones: datapath.md.</text>
  <rect x="60" y="260" width="480" height="180" rx="12" fill="#f3f5f7" stroke="#7a869a" stroke-width="2" stroke-dasharray="none" />
  <text x="300.0" y="317.0" fill="#172b4d" font-family="Helvetica, Arial, sans-serif" font-size="19" text-anchor="middle">dsi_test_pattern · EXISTENTE</text>
  <text x="300.0" y="343.0" fill="#172b4d" font-family="Helvetica, Arial, sans-serif" font-size="19" text-anchor="middle">byte[8], valid, line_last, frame_last</text>
  <text x="300.0" y="369.0" fill="#172b4d" font-family="Helvetica, Arial, sans-serif" font-size="19" text-anchor="middle">start_valid / start_ready</text>
  <text x="300.0" y="395.0" fill="#172b4d" font-family="Helvetica, Arial, sans-serif" font-size="19" text-anchor="middle">frame_done → pág. 6</text>
  <ellipse cx="890.0" cy="350.0" rx="240.0" ry="110.0" fill="#ffffff" stroke="#344563" stroke-width="2" />
  <text x="890.0" y="304.0" fill="#172b4d" font-family="Helvetica, Arial, sans-serif" font-size="19" text-anchor="middle">G_PAYLOAD · COMBINACIONAL</text>
  <text x="890.0" y="330.0" fill="#172b4d" font-family="Helvetica, Arial, sans-serif" font-size="19" text-anchor="middle">payload_data = source.byte [8]</text>
  <text x="890.0" y="356.0" fill="#172b4d" font-family="Helvetica, Arial, sans-serif" font-size="19" text-anchor="middle">payload_valid = source.valid &amp; G</text>
  <text x="890.0" y="382.0" fill="#172b4d" font-family="Helvetica, Arial, sans-serif" font-size="19" text-anchor="middle">source.ready = payload_ready &amp; G</text>
  <text x="890.0" y="408.0" fill="#172b4d" font-family="Helvetica, Arial, sans-serif" font-size="19" text-anchor="middle">G: RGB admitido, sin reset / fallo</text>
  <rect x="1250" y="240" width="480" height="220" rx="12" fill="#f3f5f7" stroke="#7a869a" stroke-width="2" stroke-dasharray="none" />
  <text x="1490.0" y="304.0" fill="#172b4d" font-family="Helvetica, Arial, sans-serif" font-size="19" text-anchor="middle">dsi_long_packet_tx · EXISTENTE</text>
  <text x="1490.0" y="330.0" fill="#172b4d" font-family="Helvetica, Arial, sans-serif" font-size="19" text-anchor="middle">cmd_vc[2], cmd_dt[6], cmd_wc[16]</text>
  <text x="1490.0" y="356.0" fill="#172b4d" font-family="Helvetica, Arial, sans-serif" font-size="19" text-anchor="middle">cmd_valid / cmd_ready</text>
  <text x="1490.0" y="382.0" fill="#172b4d" font-family="Helvetica, Arial, sans-serif" font-size="19" text-anchor="middle">payload_data / valid / ready</text>
  <text x="1490.0" y="408.0" fill="#172b4d" font-family="Helvetica, Arial, sans-serif" font-size="19" text-anchor="middle">packet_done → pág. 6</text>
  <ellipse cx="300.0" cy="680.0" rx="240.0" ry="90.0" fill="#ffffff" stroke="#344563" stroke-width="2" />
  <text x="300.0" y="647.0" fill="#172b4d" font-family="Helvetica, Arial, sans-serif" font-size="19" text-anchor="middle">BF = payload_valid &amp; payload_ready</text>
  <text x="300.0" y="673.0" fill="#172b4d" font-family="Helvetica, Arial, sans-serif" font-size="19" text-anchor="middle">DF = cmd_valid &amp; cmd_ready</text>
  <text x="300.0" y="699.0" fill="#172b4d" font-family="Helvetica, Arial, sans-serif" font-size="19" text-anchor="middle">Handshakes combinacionales [1 c/u]</text>
  <text x="300.0" y="725.0" fill="#172b4d" font-family="Helvetica, Arial, sans-serif" font-size="19" text-anchor="middle">ready vuelve hacia la fuente</text>
  <rect x="650" y="590" width="480" height="180" rx="12" fill="#f3f5f7" stroke="#7a869a" stroke-width="2" stroke-dasharray="none" />
  <text x="890.0" y="660.0" fill="#172b4d" font-family="Helvetica, Arial, sans-serif" font-size="19" text-anchor="middle">dsi_lane_packer · EXISTENTE</text>
  <text x="890.0" y="686.0" fill="#172b4d" font-family="Helvetica, Arial, sans-serif" font-size="19" text-anchor="middle">Bytes [8] → palabras [16]</text>
  <text x="890.0" y="712.0" fill="#172b4d" font-family="Helvetica, Arial, sans-serif" font-size="19" text-anchor="middle">keep[2], valid, last, ready</text>
  <rect x="1250" y="590" width="480" height="180" rx="12" fill="#f3f5f7" stroke="#7a869a" stroke-width="2" stroke-dasharray="none" />
  <text x="1490.0" y="647.0" fill="#172b4d" font-family="Helvetica, Arial, sans-serif" font-size="19" text-anchor="middle">dsi_hs_transport · EXISTENTE</text>
  <text x="1490.0" y="673.0" fill="#172b4d" font-family="Helvetica, Arial, sans-serif" font-size="19" text-anchor="middle">Buffer de paquete completo</text>
  <text x="1490.0" y="699.0" fill="#172b4d" font-family="Helvetica, Arial, sans-serif" font-size="19" text-anchor="middle">HS req / grant / done / complete</text>
  <text x="1490.0" y="725.0" fill="#172b4d" font-family="Helvetica, Arial, sans-serif" font-size="19" text-anchor="middle">error / busy → pág. 6</text>
  <rect x="60" y="870" width="1670" height="130" rx="12" fill="#f3f5f7" stroke="#7a869a" stroke-width="2" stroke-dasharray="none" />
  <text x="895.0" y="928.0" fill="#172b4d" font-family="Helvetica, Arial, sans-serif" font-size="19" text-anchor="middle">Árbitro → dphy_hs_tx → dphy_gowin_tx → pads</text>
  <text x="895.0" y="954.0" fill="#172b4d" font-family="Helvetica, Arial, sans-serif" font-size="19" text-anchor="middle">Bloques externos: petición HS y tiempos eléctricos propios. PROFILE_OK sigue bloqueado para hardware no caracterizado.</text>
  <rect x="60" y="1120" width="230" height="90" rx="12" fill="#f3f5f7" stroke="#7a869a" stroke-width="2" stroke-dasharray="none" />
  <text x="175.0" y="1171.0" fill="#172b4d" font-family="Helvetica, Arial, sans-serif" font-size="19" text-anchor="middle">0 [16]</text>
  <ellipse cx="490.0" cy="1360.0" rx="150.0" ry="60.0" fill="#ffffff" stroke="#344563" stroke-width="2" />
  <text x="490.0" y="1353.0" fill="#172b4d" font-family="Helvetica, Arial, sans-serif" font-size="19" text-anchor="middle">A2 · +1 [16]</text>
  <text x="490.0" y="1379.0" fill="#172b4d" font-family="Helvetica, Arial, sans-serif" font-size="19" text-anchor="middle">Entrada: BCNT</text>
  <polygon points="760,1120 1100,1140 1100,1280 760,1300" fill="#ffffff" stroke="#344563" stroke-width="2" />
  <text x="930.0" y="1190.0" fill="#172b4d" font-family="Helvetica, Arial, sans-serif" font-size="19" text-anchor="middle">M2 · 2:1 [16]</text>
  <text x="930.0" y="1216.0" fill="#172b4d" font-family="Helvetica, Arial, sans-serif" font-size="19" text-anchor="middle">0: 0; 1: A2</text>
  <text x="930.0" y="1242.0" fill="#172b4d" font-family="Helvetica, Arial, sans-serif" font-size="19" text-anchor="middle">SEL = !DF</text>
  <rect x="1250" y="1120" width="480" height="180" rx="0" fill="#ffffff" stroke="#344563" stroke-width="2" stroke-dasharray="none" />
  <text x="1490.0" y="1190.0" fill="#172b4d" font-family="Helvetica, Arial, sans-serif" font-size="19" text-anchor="middle">R_BCNT [16]</text>
  <text x="1490.0" y="1216.0" fill="#172b4d" font-family="Helvetica, Arial, sans-serif" font-size="19" text-anchor="middle">LD = DF | BF</text>
  <text x="1490.0" y="1242.0" fill="#172b4d" font-family="Helvetica, Arial, sans-serif" font-size="19" text-anchor="middle">rst → 0; D = M2</text>
  <ellipse cx="895.0" cy="1610.0" rx="835.0" ry="70.0" fill="#ffffff" stroke="#344563" stroke-width="2" />
  <text x="895.0" y="1590.0" fill="#172b4d" font-family="Helvetica, Arial, sans-serif" font-size="19" text-anchor="middle">C_BCNT · == WC / &lt; WC</text>
  <text x="895.0" y="1616.0" fill="#172b4d" font-family="Helvetica, Arial, sans-serif" font-size="19" text-anchor="middle">BCNT nunca avanza por encima de WC</text>
  <text x="895.0" y="1642.0" fill="#172b4d" font-family="Helvetica, Arial, sans-serif" font-size="19" text-anchor="middle">Condiciones → UC y comprobador de marcas</text>
  <rect x="60" y="1780" width="230" height="90" rx="12" fill="#f3f5f7" stroke="#7a869a" stroke-width="2" stroke-dasharray="none" />
  <text x="175.0" y="1831.0" fill="#172b4d" font-family="Helvetica, Arial, sans-serif" font-size="19" text-anchor="middle">0 [16]</text>
  <ellipse cx="490.0" cy="2020.0" rx="150.0" ry="60.0" fill="#ffffff" stroke="#344563" stroke-width="2" />
  <text x="490.0" y="2013.0" fill="#172b4d" font-family="Helvetica, Arial, sans-serif" font-size="19" text-anchor="middle">A3 · +1 [16]</text>
  <text x="490.0" y="2039.0" fill="#172b4d" font-family="Helvetica, Arial, sans-serif" font-size="19" text-anchor="middle">Entrada: LINE</text>
  <polygon points="760,1780 1100,1800 1100,1940 760,1960" fill="#ffffff" stroke="#344563" stroke-width="2" />
  <text x="930.0" y="1850.0" fill="#172b4d" font-family="Helvetica, Arial, sans-serif" font-size="19" text-anchor="middle">M3 · 2:1 [16]</text>
  <text x="930.0" y="1876.0" fill="#172b4d" font-family="Helvetica, Arial, sans-serif" font-size="19" text-anchor="middle">0: 0; 1: A3</text>
  <text x="930.0" y="1902.0" fill="#172b4d" font-family="Helvetica, Arial, sans-serif" font-size="19" text-anchor="middle">SEL = !FRAME_BEGIN</text>
  <rect x="1250" y="1780" width="480" height="180" rx="0" fill="#ffffff" stroke="#344563" stroke-width="2" stroke-dasharray="none" />
  <text x="1490.0" y="1850.0" fill="#172b4d" font-family="Helvetica, Arial, sans-serif" font-size="19" text-anchor="middle">R_LINE [16]</text>
  <text x="1490.0" y="1876.0" fill="#172b4d" font-family="Helvetica, Arial, sans-serif" font-size="19" text-anchor="middle">LD = FRAME_BEGIN | RGB_COMPLETE</text>
  <text x="1490.0" y="1902.0" fill="#172b4d" font-family="Helvetica, Arial, sans-serif" font-size="19" text-anchor="middle">rst → 0; D = M3</text>
  <ellipse cx="895.0" cy="2270.0" rx="835.0" ry="70.0" fill="#ffffff" stroke="#344563" stroke-width="2" />
  <text x="895.0" y="2250.0" fill="#172b4d" font-family="Helvetica, Arial, sans-serif" font-size="19" text-anchor="middle">C_LINE · == HEIGHT / &lt; HEIGHT</text>
  <text x="895.0" y="2276.0" fill="#172b4d" font-family="Helvetica, Arial, sans-serif" font-size="19" text-anchor="middle">LINE nunca avanza por encima de HEIGHT</text>
  <text x="895.0" y="2302.0" fill="#172b4d" font-family="Helvetica, Arial, sans-serif" font-size="19" text-anchor="middle">Condiciones → UC y comprobador de marcas</text>
  <ellipse cx="895.0" cy="2580.0" rx="835.0" ry="120.0" fill="#ffffff" stroke="#344563" stroke-width="2" />
  <text x="895.0" y="2534.0" fill="#172b4d" font-family="Helvetica, Arial, sans-serif" font-size="19" text-anchor="middle">C_MARK · COMPROBAR SOLO CON BF</text>
  <text x="895.0" y="2560.0" fill="#172b4d" font-family="Helvetica, Arial, sans-serif" font-size="19" text-anchor="middle">expect_line_last = (BCNT == WC−1)</text>
  <text x="895.0" y="2586.0" fill="#172b4d" font-family="Helvetica, Arial, sans-serif" font-size="19" text-anchor="middle">expect_frame_last = expect_line_last &amp; (LINE == HEIGHT−1)</text>
  <text x="895.0" y="2612.0" fill="#172b4d" font-family="Helvetica, Arial, sans-serif" font-size="19" text-anchor="middle">mark_error = BF &amp; ((source.line_last ≠ expect_line_last) | (source.frame_last ≠ expect_frame_last))</text>
  <text x="895.0" y="2638.0" fill="#172b4d" font-family="Helvetica, Arial, sans-serif" font-size="19" text-anchor="middle">count_error: BF con BCNT ≥ WC, o packet_done sin BCNT == WC. LINE avanza tras RGB_COMPLETE, no tras BF.</text>
  <text x="595.0" y="338.0" fill="#344563" font-family="Helvetica, Arial, sans-serif" font-size="17" paint-order="stroke" stroke="white" stroke-width="6" stroke-linejoin="round">[8] + valid</text>
  <text x="1190.0" y="338.0" fill="#344563" font-family="Helvetica, Arial, sans-serif" font-size="17" paint-order="stroke" stroke="white" stroke-width="6" stroke-linejoin="round">[8] + valid</text>
  <text x="1740.0" y="338.0" fill="#344563" font-family="Helvetica, Arial, sans-serif" font-size="17" paint-order="stroke" stroke="white" stroke-width="6" stroke-linejoin="round">[8]</text>
  <text x="1190.0" y="668.0" fill="#344563" font-family="Helvetica, Arial, sans-serif" font-size="17" paint-order="stroke" stroke="white" stroke-width="6" stroke-linejoin="round">[16] + keep[2]</text>
  <text x="1510.0" y="795.0" fill="#344563" font-family="Helvetica, Arial, sans-serif" font-size="17" paint-order="stroke" stroke="white" stroke-width="6" stroke-linejoin="round">HS</text>
  <text x="297.5" y="1153.0" fill="#344563" font-family="Helvetica, Arial, sans-serif" font-size="17" paint-order="stroke" stroke="white" stroke-width="6" stroke-linejoin="round">0 [16]</text>
  <text x="670.0" y="1348.0" fill="#344563" font-family="Helvetica, Arial, sans-serif" font-size="17" paint-order="stroke" stroke="white" stroke-width="6" stroke-linejoin="round">1 [16]</text>
  <text x="1175.0" y="1198.0" fill="#344563" font-family="Helvetica, Arial, sans-serif" font-size="17" paint-order="stroke" stroke="white" stroke-width="6" stroke-linejoin="round">D [16]</text>
  <text x="1510.0" y="1385.0" fill="#344563" font-family="Helvetica, Arial, sans-serif" font-size="17" paint-order="stroke" stroke="white" stroke-width="6" stroke-linejoin="round">Q [16]</text>
  <text x="297.5" y="1813.0" fill="#344563" font-family="Helvetica, Arial, sans-serif" font-size="17" paint-order="stroke" stroke="white" stroke-width="6" stroke-linejoin="round">0 [16]</text>
  <text x="670.0" y="2008.0" fill="#344563" font-family="Helvetica, Arial, sans-serif" font-size="17" paint-order="stroke" stroke="white" stroke-width="6" stroke-linejoin="round">1 [16]</text>
  <text x="1175.0" y="1858.0" fill="#344563" font-family="Helvetica, Arial, sans-serif" font-size="17" paint-order="stroke" stroke="white" stroke-width="6" stroke-linejoin="round">D [16]</text>
  <text x="1510.0" y="2045.0" fill="#344563" font-family="Helvetica, Arial, sans-serif" font-size="17" paint-order="stroke" stroke="white" stroke-width="6" stroke-linejoin="round">Q [16]</text>
