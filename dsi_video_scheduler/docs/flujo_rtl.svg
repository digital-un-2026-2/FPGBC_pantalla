<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="3450" viewBox="0 0 1800 3450">
  <title>2 · PLANIFICADOR RTL DE VIDEO — Planificador DSI propuesto</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5c708a" />
    </marker>
  </defs>
  <rect width="1800" height="3450" fill="white" />
  <polyline points="760.0,360 760.0,440" fill="none" stroke="#5c708a" stroke-width="2" marker-end="url(#arrow)" />
  <polyline points="760.0,560 760.0,640" fill="none" stroke="#5c708a" stroke-width="2" marker-end="url(#arrow)" />
  <polyline points="760.0,760 760.0,850" fill="none" stroke="#5c708a" stroke-width="2" marker-end="url(#arrow)" />
  <polyline points="760.0,970 760.0,1050" fill="none" stroke="#5c708a" stroke-width="2" marker-end="url(#arrow)" />
  <polyline points="760.0,1650 760.0,1740" fill="none" stroke="#5c708a" stroke-width="2" marker-end="url(#arrow)" />
  <polyline points="760.0,1870 760.0,1960" fill="none" stroke="#5c708a" stroke-width="2" marker-end="url(#arrow)" />
  <polyline points="760.0,2350 760.0,2440" fill="none" stroke="#5c708a" stroke-width="2" marker-end="url(#arrow)" />
  <polyline points="760.0,1190 760.0,1280" fill="none" stroke="#5c708a" stroke-width="2" marker-end="url(#arrow)" />
  <polyline points="1090,1120.0 1200,1120.0 1200,1075.0" fill="none" stroke="#5c708a" stroke-width="2" marker-end="url(#arrow)" />
  <polyline points="1455.0,1150 1455.0,1240" fill="none" stroke="#5c708a" stroke-width="2" marker-end="url(#arrow)" />
  <polyline points="1455.0,1390 1455.0,1480" fill="none" stroke="#5c708a" stroke-width="2" marker-end="url(#arrow)" />
  <polyline points="1710,1315.0 1750,1315 1750,700 1090,700.0" fill="none" stroke="#5c708a" stroke-width="2" marker-end="url(#arrow)" />
  <polyline points="430,1350.0 385,1350 385,1370 340,1370.0" fill="none" stroke="#5c708a" stroke-width="2" marker-end="url(#arrow)" />
  <polyline points="50,1370.0 30,1370 30,910 430,910.0" fill="none" stroke="#5c708a" stroke-width="2" marker-end="url(#arrow)" />
  <polyline points="760.0,1420 760.0,1520" fill="none" stroke="#5c708a" stroke-width="2" marker-end="url(#arrow)" />
  <polyline points="760.0,2120 760.0,2220" fill="none" stroke="#5c708a" stroke-width="2" marker-end="url(#arrow)" />
  <polyline points="430,2040.0 360,2040 360,1805 430,1805.0" fill="none" stroke="#5c708a" stroke-width="2" marker-end="url(#arrow)" />
  <polyline points="760.0,2600 760.0,2700" fill="none" stroke="#5c708a" stroke-width="2" marker-end="url(#arrow)" />
  <polyline points="1090,2520.0 1200,2520.0" fill="none" stroke="#5c708a" stroke-width="2" marker-end="url(#arrow)" />
  <polyline points="760.0,2820 760,2900 390,2900 390,910 430,910.0" fill="none" stroke="#5c708a" stroke-width="2" marker-end="url(#arrow)" />
  <text x="60" y="65.5" fill="#172b4d" font-family="Helvetica, Arial, sans-serif" font-size="28" text-anchor="start">PLANIFICADOR DSI · FLUJO RTL</text>
  <text x="60" y="138.0" fill="#172b4d" font-family="Helvetica, Arial, sans-serif" font-size="19" text-anchor="start">PROPUESTA · Calendario de eventos según el modo del panel, sin fijar porches, fps ni bitrate.</text>
  <text x="60" y="164.0" fill="#172b4d" font-family="Helvetica, Arial, sans-serif" font-size="19" text-anchor="start">Fuente inicial: dsi_test_pattern; reloj de vídeo y relación con CSR por definir al integrar.</text>
  <rect x="430" y="240" width="660" height="120" rx="12" fill="#eaf2fc" stroke="#5b7fa6" stroke-width="2" stroke-dasharray="none" />
  <text x="760.0" y="280.0" fill="#172b4d" font-family="Helvetica, Arial, sans-serif" font-size="19" text-anchor="middle">RESET COORDINADO</text>
  <text x="760.0" y="306.0" fill="#172b4d" font-family="Helvetica, Arial, sans-serif" font-size="19" text-anchor="middle">Invalidar cuadro, eventos y configuración activa</text>
  <text x="760.0" y="332.0" fill="#172b4d" font-family="Helvetica, Arial, sans-serif" font-size="19" text-anchor="middle">Bloquear nuevas transferencias</text>
  <rect x="430" y="440" width="660" height="120" rx="12" fill="#eaf2fc" stroke="#5b7fa6" stroke-width="2" stroke-dasharray="none" />
  <text x="760.0" y="480.0" fill="#172b4d" font-family="Helvetica, Arial, sans-serif" font-size="19" text-anchor="middle">ESPERAR START AUTORIZADO</text>
  <text x="760.0" y="506.0" fill="#172b4d" font-family="Helvetica, Arial, sans-serif" font-size="19" text-anchor="middle">Configuración válida + panel inicializado</text>
  <text x="760.0" y="532.0" fill="#172b4d" font-family="Helvetica, Arial, sans-serif" font-size="19" text-anchor="middle">PHY disponible + cadena libre de fallos</text>
  <rect x="430" y="640" width="660" height="120" rx="12" fill="#eaf2fc" stroke="#5b7fa6" stroke-width="2" stroke-dasharray="none" />
  <text x="760.0" y="680.0" fill="#172b4d" font-family="Helvetica, Arial, sans-serif" font-size="19" text-anchor="middle">INICIAR CUADRO</text>
  <text x="760.0" y="706.0" fill="#172b4d" font-family="Helvetica, Arial, sans-serif" font-size="19" text-anchor="middle">Conservar perfil activo; reiniciar línea y calendario</text>
  <text x="760.0" y="732.0" fill="#172b4d" font-family="Helvetica, Arial, sans-serif" font-size="19" text-anchor="middle">Iniciar fuente con start_valid ∧ start_ready</text>
  <rect x="430" y="850" width="660" height="120" rx="12" fill="#eaf2fc" stroke="#5b7fa6" stroke-width="2" stroke-dasharray="none" />
  <text x="760.0" y="890.0" fill="#172b4d" font-family="Helvetica, Arial, sans-serif" font-size="19" text-anchor="middle">SELECCIONAR SIGUIENTE EVENTO</text>
  <text x="760.0" y="916.0" fill="#172b4d" font-family="Helvetica, Arial, sans-serif" font-size="19" text-anchor="middle">Según línea, cuadro y modo del perfil</text>
  <text x="760.0" y="942.0" fill="#172b4d" font-family="Helvetica, Arial, sans-serif" font-size="19" text-anchor="middle">Evento: espera, paquete o fin de cuadro</text>
  <polygon points="760.0,1050 1090,1120.0 760.0,1190 430,1120.0" fill="#fff4d6" stroke="#b69a50" stroke-width="2" />
  <text x="760.0" y="1126.0" fill="#172b4d" font-family="Helvetica, Arial, sans-serif" font-size="19" text-anchor="middle">¿Evento = fin de cuadro?</text>
  <polygon points="760.0,1280 1090,1350.0 760.0,1420 430,1350.0" fill="#fff4d6" stroke="#b69a50" stroke-width="2" />
  <text x="760.0" y="1356.0" fill="#172b4d" font-family="Helvetica, Arial, sans-serif" font-size="19" text-anchor="middle">¿Evento = espera?</text>
  <rect x="430" y="1520" width="660" height="130" rx="12" fill="#eaf2fc" stroke="#5b7fa6" stroke-width="2" stroke-dasharray="none" />
  <text x="760.0" y="1565.0" fill="#172b4d" font-family="Helvetica, Arial, sans-serif" font-size="19" text-anchor="middle">OFRECER DESCRIPTOR DEL PAQUETE</text>
  <text x="760.0" y="1591.0" fill="#172b4d" font-family="Helvetica, Arial, sans-serif" font-size="19" text-anchor="middle">Mantener campos y valid hasta ready</text>
  <text x="760.0" y="1617.0" fill="#172b4d" font-family="Helvetica, Arial, sans-serif" font-size="19" text-anchor="middle">RGB888: DT=0x3E; WC=3×WIDTH; VC del perfil</text>
  <rect x="430" y="1740" width="660" height="130" rx="12" fill="#eaf2fc" stroke="#5b7fa6" stroke-width="2" stroke-dasharray="none" />
  <text x="760.0" y="1785.0" fill="#172b4d" font-family="Helvetica, Arial, sans-serif" font-size="19" text-anchor="middle">PREPARAR Y CARGAR PAQUETE COMPLETO</text>
  <text x="760.0" y="1811.0" fill="#172b4d" font-family="Helvetica, Arial, sans-serif" font-size="19" text-anchor="middle">Para RGB: conectar payload de la fuente</text>
  <text x="760.0" y="1837.0" fill="#172b4d" font-family="Helvetica, Arial, sans-serif" font-size="19" text-anchor="middle">Solo valid ∧ ready consume bytes; comprobar marcas</text>
  <polygon points="760.0,1960 1090,2040.0 760.0,2120 430,2040.0" fill="#fff4d6" stroke="#b69a50" stroke-width="2" />
  <text x="760.0" y="2033.0" fill="#172b4d" font-family="Helvetica, Arial, sans-serif" font-size="19" text-anchor="middle">¿Paquete aceptado completo</text>
  <text x="760.0" y="2059.0" fill="#172b4d" font-family="Helvetica, Arial, sans-serif" font-size="19" text-anchor="middle">por la cadena de salida?</text>
  <rect x="430" y="2220" width="660" height="130" rx="12" fill="#eaf2fc" stroke="#5b7fa6" stroke-width="2" stroke-dasharray="none" />
  <text x="760.0" y="2265.0" fill="#172b4d" font-family="Helvetica, Arial, sans-serif" font-size="19" text-anchor="middle">ESPERAR FIN DEL TRANSPORTE</text>
  <text x="760.0" y="2291.0" fill="#172b4d" font-family="Helvetica, Arial, sans-serif" font-size="19" text-anchor="middle">Retener eventos de fin aunque lleguen antes</text>
  <text x="760.0" y="2317.0" fill="#172b4d" font-family="Helvetica, Arial, sans-serif" font-size="19" text-anchor="middle">Esperar hs_complete y transporte disponible</text>
  <polygon points="760.0,2440 1090,2520.0 760.0,2600 430,2520.0" fill="#fff4d6" stroke="#b69a50" stroke-width="2" />
  <text x="760.0" y="2513.0" fill="#172b4d" font-family="Helvetica, Arial, sans-serif" font-size="19" text-anchor="middle">¿Se cumple el calendario</text>
  <text x="760.0" y="2539.0" fill="#172b4d" font-family="Helvetica, Arial, sans-serif" font-size="19" text-anchor="middle">sin error de la cadena?</text>
  <rect x="430" y="2700" width="660" height="120" rx="12" fill="#eaf2fc" stroke="#5b7fa6" stroke-width="2" stroke-dasharray="none" />
  <text x="760.0" y="2740.0" fill="#172b4d" font-family="Helvetica, Arial, sans-serif" font-size="19" text-anchor="middle">AVANZAR EVENTO / LÍNEA</text>
  <text x="760.0" y="2766.0" fill="#172b4d" font-family="Helvetica, Arial, sans-serif" font-size="19" text-anchor="middle">Solo después del paquete completo</text>
  <text x="760.0" y="2792.0" fill="#172b4d" font-family="Helvetica, Arial, sans-serif" font-size="19" text-anchor="middle">No iniciar otro cuadro con fin local del payload</text>
  <rect x="1200" y="1000" width="510" height="150" rx="12" fill="#eaf2fc" stroke="#5b7fa6" stroke-width="2" stroke-dasharray="none" />
  <text x="1455.0" y="1055.0" fill="#172b4d" font-family="Helvetica, Arial, sans-serif" font-size="19" text-anchor="middle">CUADRO TRANSMITIDO LOCALMENTE</text>
  <text x="1455.0" y="1081.0" fill="#172b4d" font-family="Helvetica, Arial, sans-serif" font-size="19" text-anchor="middle">Incrementar frame_count</text>
  <text x="1455.0" y="1107.0" fill="#172b4d" font-family="Helvetica, Arial, sans-serif" font-size="19" text-anchor="middle">Incluye finalización del último evento</text>
  <polygon points="1455.0,1240 1710,1315.0 1455.0,1390 1200,1315.0" fill="#fff4d6" stroke="#b69a50" stroke-width="2" />
  <text x="1455.0" y="1321.0" fill="#172b4d" font-family="Helvetica, Arial, sans-serif" font-size="19" text-anchor="middle">¿STOP pendiente?</text>
  <rect x="1200" y="1480" width="510" height="140" rx="28" fill="#e8edf4" stroke="#5c708a" stroke-width="2" stroke-dasharray="none" />
  <text x="1455.0" y="1530.0" fill="#172b4d" font-family="Helvetica, Arial, sans-serif" font-size="19" text-anchor="middle">DETENIDO</text>
  <text x="1455.0" y="1556.0" fill="#172b4d" font-family="Helvetica, Arial, sans-serif" font-size="19" text-anchor="middle">Publicar stopped con enlace libre</text>
  <text x="1455.0" y="1582.0" fill="#172b4d" font-family="Helvetica, Arial, sans-serif" font-size="19" text-anchor="middle">Aceptar configuración o inicialización</text>
  <rect x="50" y="1280" width="290" height="180" rx="12" fill="#eaf2fc" stroke="#5b7fa6" stroke-width="2" stroke-dasharray="none" />
  <text x="195.0" y="1350.0" fill="#172b4d" font-family="Helvetica, Arial, sans-serif" font-size="19" text-anchor="middle">ESPERAR PLAZO</text>
  <text x="195.0" y="1376.0" fill="#172b4d" font-family="Helvetica, Arial, sans-serif" font-size="19" text-anchor="middle">Contador RTL</text>
  <text x="195.0" y="1402.0" fill="#172b4d" font-family="Helvetica, Arial, sans-serif" font-size="19" text-anchor="middle">Al vencer: avanzar</text>
  <rect x="1200" y="2410" width="510" height="220" rx="12" fill="#fde9e7" stroke="#ba5d54" stroke-width="2" stroke-dasharray="none" />
  <text x="1455.0" y="2474.0" fill="#172b4d" font-family="Helvetica, Arial, sans-serif" font-size="19" text-anchor="middle">FALLO PERSISTENTE</text>
  <text x="1455.0" y="2500.0" fill="#172b4d" font-family="Helvetica, Arial, sans-serif" font-size="19" text-anchor="middle">Bloquear nuevos descriptores</text>
  <text x="1455.0" y="2526.0" fill="#172b4d" font-family="Helvetica, Arial, sans-serif" font-size="19" text-anchor="middle">Publicar primera causa por CSR</text>
  <text x="1455.0" y="2552.0" fill="#172b4d" font-family="Helvetica, Arial, sans-serif" font-size="19" text-anchor="middle">Si falla PHY: aplicar aborto existente</text>
  <text x="1455.0" y="2578.0" fill="#172b4d" font-family="Helvetica, Arial, sans-serif" font-size="19" text-anchor="middle">Recuperar con reset de toda la cadena</text>
  <text x="1200" y="1859.0" fill="#172b4d" font-family="Helvetica, Arial, sans-serif" font-size="19" text-anchor="start">DOS FINALES DIFERENTES</text>
  <text x="1200" y="1885.0" fill="#172b4d" font-family="Helvetica, Arial, sans-serif" font-size="19" text-anchor="start" />
  <text x="1200" y="1911.0" fill="#172b4d" font-family="Helvetica, Arial, sans-serif" font-size="19" text-anchor="start">packet_done: CRC final aceptado por el</text>
  <text x="1200" y="1937.0" fill="#172b4d" font-family="Helvetica, Arial, sans-serif" font-size="19" text-anchor="start">consumidor del preparador.</text>
  <text x="1200" y="1963.0" fill="#172b4d" font-family="Helvetica, Arial, sans-serif" font-size="19" text-anchor="start">hs_done: última palabra entregada al PHY.</text>
  <text x="1200" y="1989.0" fill="#172b4d" font-family="Helvetica, Arial, sans-serif" font-size="19" text-anchor="start">hs_complete: secuencia HS finalizada.</text>
  <text x="1200" y="2015.0" fill="#172b4d" font-family="Helvetica, Arial, sans-serif" font-size="19" text-anchor="start" />
  <text x="1200" y="2041.0" fill="#172b4d" font-family="Helvetica, Arial, sans-serif" font-size="19" text-anchor="start">El planificador debe conservar estos eventos, no</text>
  <text x="1200" y="2067.0" fill="#172b4d" font-family="Helvetica, Arial, sans-serif" font-size="19" text-anchor="start">exigir pulsos simultáneos.</text>
  <text x="1200" y="2093.0" fill="#172b4d" font-family="Helvetica, Arial, sans-serif" font-size="19" text-anchor="start">Ninguno confirma recepción del LCD.</text>
  <text x="1200" y="2865.0" fill="#172b4d" font-family="Helvetica, Arial, sans-serif" font-size="19" text-anchor="start">PRIORIDADES GLOBALES</text>
  <text x="1200" y="2891.0" fill="#172b4d" font-family="Helvetica, Arial, sans-serif" font-size="19" text-anchor="start" />
  <text x="1200" y="2917.0" fill="#172b4d" font-family="Helvetica, Arial, sans-serif" font-size="19" text-anchor="start">1. Reset coordinado → RESET.</text>
  <text x="1200" y="2943.0" fill="#172b4d" font-family="Helvetica, Arial, sans-serif" font-size="19" text-anchor="start">2. Fallo / aborto → FALLO.</text>
  <text x="1200" y="2969.0" fill="#172b4d" font-family="Helvetica, Arial, sans-serif" font-size="19" text-anchor="start">3. STOP → retener solicitud y terminar cuadro.</text>
  <text x="1200" y="2995.0" fill="#172b4d" font-family="Helvetica, Arial, sans-serif" font-size="19" text-anchor="start" />
  <text x="1200" y="3021.0" fill="#172b4d" font-family="Helvetica, Arial, sans-serif" font-size="19" text-anchor="start">Fallo o plazo perdido no se reintentan como</text>
  <text x="1200" y="3047.0" fill="#172b4d" font-family="Helvetica, Arial, sans-serif" font-size="19" text-anchor="start">cuadro correcto.</text>
  <text x="60" y="3078.0" fill="#172b4d" font-family="Helvetica, Arial, sans-serif" font-size="19" text-anchor="start">CONTRATO DE LA PROPUESTA</text>
  <text x="60" y="3104.0" fill="#172b4d" font-family="Helvetica, Arial, sans-serif" font-size="19" text-anchor="start" />
  <text x="60" y="3130.0" fill="#172b4d" font-family="Helvetica, Arial, sans-serif" font-size="19" text-anchor="start">• Esperas y ready: conservar datos y descriptor; reset/fallo tienen prioridad global.</text>
  <text x="60" y="3156.0" fill="#172b4d" font-family="Helvetica, Arial, sans-serif" font-size="19" text-anchor="start">• Un paquete en vuelo; el transporte actual no carga el siguiente durante HS.</text>
  <text x="60" y="3182.0" fill="#172b4d" font-family="Helvetica, Arial, sans-serif" font-size="19" text-anchor="start">• Configuración activa inmutable; STOP se atiende al terminar el cuadro.</text>
  <text x="60" y="3208.0" fill="#172b4d" font-family="Helvetica, Arial, sans-serif" font-size="19" text-anchor="start">• Si un plazo vence en cualquier operación, registrar fallo; no acumular retraso silencioso.</text>
  <text x="60" y="3234.0" fill="#172b4d" font-family="Helvetica, Arial, sans-serif" font-size="19" text-anchor="start">• El calendario debe incluir carga del paquete, arranque/parada HS y tiempo de enlace.</text>
  <text x="60" y="3378.0" fill="#172b4d" font-family="Helvetica, Arial, sans-serif" font-size="19" text-anchor="start">LÍMITES · El calendario exacto depende de Video/Command Mode y del panel. Eventos no RGB requieren</text>
  <text x="60" y="3404.0" fill="#172b4d" font-family="Helvetica, Arial, sans-serif" font-size="19" text-anchor="start">preparación adicional. Este flujo no demuestra que el transporte actual alcance la frecuencia de imagen requerida.</text>
  <text x="780.0" y="1235.0" fill="#344563" font-family="Helvetica, Arial, sans-serif" font-size="17" paint-order="stroke" stroke="white" stroke-width="6" stroke-linejoin="round">No</text>
  <text x="1145.0" y="1108.0" fill="#344563" font-family="Helvetica, Arial, sans-serif" font-size="17" paint-order="stroke" stroke="white" stroke-width="6" stroke-linejoin="round">Sí</text>
  <text x="1475.0" y="1435.0" fill="#344563" font-family="Helvetica, Arial, sans-serif" font-size="17" paint-order="stroke" stroke="white" stroke-width="6" stroke-linejoin="round">Sí</text>
  <text x="1730.0" y="1303.0" fill="#344563" font-family="Helvetica, Arial, sans-serif" font-size="17" paint-order="stroke" stroke="white" stroke-width="6" stroke-linejoin="round">No</text>
  <text x="407.5" y="1338.0" fill="#344563" font-family="Helvetica, Arial, sans-serif" font-size="17" paint-order="stroke" stroke="white" stroke-width="6" stroke-linejoin="round">Sí</text>
  <text x="40.0" y="1358.0" fill="#344563" font-family="Helvetica, Arial, sans-serif" font-size="17" paint-order="stroke" stroke="white" stroke-width="6" stroke-linejoin="round">Venció</text>
  <text x="780.0" y="1470.0" fill="#344563" font-family="Helvetica, Arial, sans-serif" font-size="17" paint-order="stroke" stroke="white" stroke-width="6" stroke-linejoin="round">No</text>
  <text x="780.0" y="2170.0" fill="#344563" font-family="Helvetica, Arial, sans-serif" font-size="17" paint-order="stroke" stroke="white" stroke-width="6" stroke-linejoin="round">Sí</text>
  <text x="395.0" y="2028.0" fill="#344563" font-family="Helvetica, Arial, sans-serif" font-size="17" paint-order="stroke" stroke="white" stroke-width="6" stroke-linejoin="round">No: continuar</text>
  <text x="780.0" y="2650.0" fill="#344563" font-family="Helvetica, Arial, sans-serif" font-size="17" paint-order="stroke" stroke="white" stroke-width="6" stroke-linejoin="round">Sí</text>
  <text x="1145.0" y="2508.0" fill="#344563" font-family="Helvetica, Arial, sans-serif" font-size="17" paint-order="stroke" stroke="white" stroke-width="6" stroke-linejoin="round">No</text>
  <text x="780.0" y="2860.0" fill="#344563" font-family="Helvetica, Arial, sans-serif" font-size="17" paint-order="stroke" stroke="white" stroke-width="6" stroke-linejoin="round">Siguiente</text>
</svg>