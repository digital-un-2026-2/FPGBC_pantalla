<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="2400" viewBox="0 0 1800 2400">
  <title>3 · DATAPATH · CONFIGURACIÓN — Planificador DSI propuesto</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5c708a" />
    </marker>
  </defs>
  <rect width="1800" height="2400" fill="white" />
  <polyline points="430,340.0 560,340.0" fill="none" stroke="#5c708a" stroke-width="2" marker-end="url(#arrow)" />
  <polyline points="960,340.0 1120,340.0 1120,350.0" fill="none" stroke="#5c708a" stroke-width="2" marker-end="url(#arrow)" />
  <polyline points="760.0,430 760.0,650" fill="none" stroke="#5c708a" stroke-width="2" marker-end="url(#arrow)" />
  <polyline points="960,740.0 1120,740.0" fill="none" stroke="#5c708a" stroke-width="2" marker-end="url(#arrow)" />
  <polyline points="1420.0,860 1420,950 760,950 760.0,1080" fill="none" stroke="#5c708a" stroke-width="2" marker-end="url(#arrow)" />
  <polyline points="960,1175.0 1120,1175.0 1120,1170.0" fill="none" stroke="#5c708a" stroke-width="2" marker-end="url(#arrow)" />
  <polyline points="1120,1660.0 960,1660.0" fill="none" stroke="#5c708a" stroke-width="2" marker-end="url(#arrow)" />
  <polyline points="560,1660.0 430,1660.0 430,1675.0" fill="none" stroke="#5c708a" stroke-width="2" marker-end="url(#arrow)" />
  <polyline points="890.0,1950 890,1910 500,1910 500,740 560,740.0" fill="none" stroke="#5c708a" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="8 6" />
  <text x="60" y="65.5" fill="#172b4d" font-family="Helvetica, Arial, sans-serif" font-size="28" text-anchor="start">DATAPATH 1/4 · CONFIGURACIÓN Y CSR</text>
  <text x="60" y="143.0" fill="#172b4d" font-family="Helvetica, Arial, sans-serif" font-size="19" text-anchor="start">CSR propuestos; sin direcciones asignadas. Perfil seleccionado de una tabla constante.</text>
  <text x="60" y="169.0" fill="#172b4d" font-family="Helvetica, Arial, sans-serif" font-size="19" text-anchor="start">Las dimensiones deben coincidir con WIDTH/HEIGHT del generador elaborado; no se cambia su tamaño por software.</text>
  <text x="60" y="2328.0" fill="#172b4d" font-family="Helvetica, Arial, sans-serif" font-size="19" text-anchor="start">PROPUESTA · Registros en ↑clk; rst síncrono prioritario. LD=0 conserva Q.</text>
  <text x="60" y="2354.0" fill="#172b4d" font-family="Helvetica, Arial, sans-serif" font-size="19" text-anchor="start">Buses [n]; controles discontinuos. Redes con el mismo nombre se conectan entre páginas. Ecuaciones: datapath.md.</text>
  <rect x="60" y="270" width="370" height="140" rx="12" fill="#f3f5f7" stroke="#7a869a" stroke-width="2" stroke-dasharray="none" />
  <text x="245.0" y="320.0" fill="#172b4d" font-family="Helvetica, Arial, sans-serif" font-size="19" text-anchor="middle">RISC-V / LiteX</text>
  <text x="245.0" y="346.0" fill="#172b4d" font-family="Helvetica, Arial, sans-serif" font-size="19" text-anchor="middle">Escritura CSR</text>
  <text x="245.0" y="372.0" fill="#172b4d" font-family="Helvetica, Arial, sans-serif" font-size="19" text-anchor="middle">profile_id[8], VC[2]</text>
  <rect x="560" y="250" width="400" height="180" rx="0" fill="#ffffff" stroke="#344563" stroke-width="2" stroke-dasharray="none" />
  <text x="760.0" y="307.0" fill="#172b4d" font-family="Helvetica, Arial, sans-serif" font-size="19" text-anchor="middle">R_SHADOW [10] · CSR</text>
  <text x="760.0" y="333.0" fill="#172b4d" font-family="Helvetica, Arial, sans-serif" font-size="19" text-anchor="middle">{profile_id, VC}</text>
  <text x="760.0" y="359.0" fill="#172b4d" font-family="Helvetica, Arial, sans-serif" font-size="19" text-anchor="middle">LD = cfg_write &amp; stopped</text>
  <text x="760.0" y="385.0" fill="#172b4d" font-family="Helvetica, Arial, sans-serif" font-size="19" text-anchor="middle">Reset → 0</text>
  <ellipse cx="1420.0" cy="350.0" rx="300.0" ry="120.0" fill="#ffffff" stroke="#344563" stroke-width="2" />
  <text x="1420.0" y="304.0" fill="#172b4d" font-family="Helvetica, Arial, sans-serif" font-size="19" text-anchor="middle">C_CFG · VALIDACIÓN</text>
  <text x="1420.0" y="330.0" fill="#172b4d" font-family="Helvetica, Arial, sans-serif" font-size="19" text-anchor="middle">ID &lt; N_PROFILES; fuente compatible</text>
  <text x="1420.0" y="356.0" fill="#172b4d" font-family="Helvetica, Arial, sans-serif" font-size="19" text-anchor="middle">WC ≤ 65535; WC+6 ≤ 2×BUFFER_WORDS</text>
  <text x="1420.0" y="382.0" fill="#172b4d" font-family="Helvetica, Arial, sans-serif" font-size="19" text-anchor="middle">Paquete par; calendario certificado</text>
  <text x="1420.0" y="408.0" fill="#172b4d" font-family="Helvetica, Arial, sans-serif" font-size="19" text-anchor="middle">Destino simulación / PHY compatible</text>
  <rect x="60" y="620" width="370" height="250" rx="12" fill="#f3f5f7" stroke="#7a869a" stroke-width="2" stroke-dasharray="none" />
  <text x="245.0" y="660.0" fill="#172b4d" font-family="Helvetica, Arial, sans-serif" font-size="19" text-anchor="middle">ÓRDENES CSR → UC</text>
  <text x="245.0" y="686.0" fill="#172b4d" font-family="Helvetica, Arial, sans-serif" font-size="19" text-anchor="middle">APPLY; START; STOP</text>
  <text x="245.0" y="712.0" fill="#172b4d" font-family="Helvetica, Arial, sans-serif" font-size="19" text-anchor="middle">panel_initialized; reset</text>
  <text x="245.0" y="738.0" fill="#172b4d" font-family="Helvetica, Arial, sans-serif" font-size="19" text-anchor="middle">coordinado</text>
  <text x="245.0" y="764.0" fill="#172b4d" font-family="Helvetica, Arial, sans-serif" font-size="19" text-anchor="middle">Escribir configuración invalida</text>
  <text x="245.0" y="790.0" fill="#172b4d" font-family="Helvetica, Arial, sans-serif" font-size="19" text-anchor="middle">config_ok</text>
  <text x="245.0" y="816.0" fill="#172b4d" font-family="Helvetica, Arial, sans-serif" font-size="19" text-anchor="middle">Escritura activa: rechazar sin</text>
  <text x="245.0" y="842.0" fill="#172b4d" font-family="Helvetica, Arial, sans-serif" font-size="19" text-anchor="middle">alterar Q</text>
  <rect x="560" y="650" width="400" height="180" rx="0" fill="#ffffff" stroke="#344563" stroke-width="2" stroke-dasharray="none" />
  <text x="760.0" y="707.0" fill="#172b4d" font-family="Helvetica, Arial, sans-serif" font-size="19" text-anchor="middle">R_ACTIVE [10]</text>
  <text x="760.0" y="733.0" fill="#172b4d" font-family="Helvetica, Arial, sans-serif" font-size="19" text-anchor="middle">D = R_SHADOW</text>
  <text x="760.0" y="759.0" fill="#172b4d" font-family="Helvetica, Arial, sans-serif" font-size="19" text-anchor="middle">LD = START_ACCEPT</text>
  <text x="760.0" y="785.0" fill="#172b4d" font-family="Helvetica, Arial, sans-serif" font-size="19" text-anchor="middle">Reset → 0</text>
  <rect x="1120" y="620" width="600" height="240" rx="0" fill="#ffffff" stroke="#344563" stroke-width="2" stroke-dasharray="none" />
  <text x="1420.0" y="694.0" fill="#172b4d" font-family="Helvetica, Arial, sans-serif" font-size="19" text-anchor="middle">ROM_META · CONSTANTES</text>
  <text x="1420.0" y="720.0" fill="#172b4d" font-family="Helvetica, Arial, sans-serif" font-size="19" text-anchor="middle">Dirección: active_profile_id[8]</text>
  <text x="1420.0" y="746.0" fill="#172b4d" font-family="Helvetica, Arial, sans-serif" font-size="19" text-anchor="middle">WIDTH[16], HEIGHT[16], N_EVENTS[16]</text>
  <text x="1420.0" y="772.0" fill="#172b4d" font-family="Helvetica, Arial, sans-serif" font-size="19" text-anchor="middle">T_FRAME[32], certificado / destino</text>
  <text x="1420.0" y="798.0" fill="#172b4d" font-family="Helvetica, Arial, sans-serif" font-size="19" text-anchor="middle">Lectura combinacional</text>
  <ellipse cx="760.0" cy="1175.0" rx="200.0" ry="95.0" fill="#ffffff" stroke="#344563" stroke-width="2" />
  <text x="760.0" y="1142.0" fill="#172b4d" font-family="Helvetica, Arial, sans-serif" font-size="19" text-anchor="middle">A_WC · SUMA [18]</text>
  <text x="760.0" y="1168.0" fill="#172b4d" font-family="Helvetica, Arial, sans-serif" font-size="19" text-anchor="middle">W_EXT + (W_EXT &lt;&lt; 1)</text>
  <text x="760.0" y="1194.0" fill="#172b4d" font-family="Helvetica, Arial, sans-serif" font-size="19" text-anchor="middle">Extender WIDTH antes de sumar</text>
  <text x="760.0" y="1220.0" fill="#172b4d" font-family="Helvetica, Arial, sans-serif" font-size="19" text-anchor="middle">Solo truncar tras validar</text>
  <rect x="1120" y="1060" width="600" height="220" rx="12" fill="#f3f5f7" stroke="#7a869a" stroke-width="2" stroke-dasharray="none" />
  <text x="1420.0" y="1124.0" fill="#172b4d" font-family="Helvetica, Arial, sans-serif" font-size="19" text-anchor="middle">DESCRIPTOR RGB888</text>
  <text x="1420.0" y="1150.0" fill="#172b4d" font-family="Helvetica, Arial, sans-serif" font-size="19" text-anchor="middle">cmd_vc = R_ACTIVE.VC [2]</text>
  <text x="1420.0" y="1176.0" fill="#172b4d" font-family="Helvetica, Arial, sans-serif" font-size="19" text-anchor="middle">cmd_dt = 0x3E [6]</text>
  <text x="1420.0" y="1202.0" fill="#172b4d" font-family="Helvetica, Arial, sans-serif" font-size="19" text-anchor="middle">cmd_wc = WC_EXT[15:0] [16]</text>
  <text x="1420.0" y="1228.0" fill="#172b4d" font-family="Helvetica, Arial, sans-serif" font-size="19" text-anchor="middle">→ Preparador largo, pág. 5</text>
  <text x="60" y="1146.0" fill="#172b4d" font-family="Helvetica, Arial, sans-serif" font-size="19" text-anchor="start">REDES DE CONFIGURACIÓN ACTIVA</text>
  <text x="60" y="1172.0" fill="#172b4d" font-family="Helvetica, Arial, sans-serif" font-size="19" text-anchor="start">HEIGHT[16] → contador de líneas</text>
  <text x="60" y="1198.0" fill="#172b4d" font-family="Helvetica, Arial, sans-serif" font-size="19" text-anchor="start">N_EVENTS[16] → límite de índice</text>
  <text x="60" y="1224.0" fill="#172b4d" font-family="Helvetica, Arial, sans-serif" font-size="19" text-anchor="start">T_FRAME[32] → límite de cuadro</text>
  <text x="60" y="1250.0" fill="#172b4d" font-family="Helvetica, Arial, sans-serif" font-size="19" text-anchor="start">active_profile_id[8] → ROM_EVENT</text>
  <text x="60" y="1276.0" fill="#172b4d" font-family="Helvetica, Arial, sans-serif" font-size="19" text-anchor="start">VC[2] → descriptor RGB</text>
  <rect x="60" y="1580" width="370" height="190" rx="12" fill="#f3f5f7" stroke="#7a869a" stroke-width="2" stroke-dasharray="none" />
  <text x="245.0" y="1642.0" fill="#172b4d" font-family="Helvetica, Arial, sans-serif" font-size="19" text-anchor="middle">LECTURA CSR POR CPU</text>
  <text x="245.0" y="1668.0" fill="#172b4d" font-family="Helvetica, Arial, sans-serif" font-size="19" text-anchor="middle">Estado y diagnóstico</text>
  <text x="245.0" y="1694.0" fill="#172b4d" font-family="Helvetica, Arial, sans-serif" font-size="19" text-anchor="middle">Perfil / dimensiones activas</text>
  <text x="245.0" y="1720.0" fill="#172b4d" font-family="Helvetica, Arial, sans-serif" font-size="19" text-anchor="middle">frame_count y primera causa</text>
  <polygon points="560,1510 960,1530 960,1790 560,1810" fill="#ffffff" stroke="#344563" stroke-width="2" />
  <text x="760.0" y="1601.0" fill="#172b4d" font-family="Helvetica, Arial, sans-serif" font-size="19" text-anchor="middle">M_STATUS · N:1 [32]</text>
  <text x="760.0" y="1627.0" fill="#172b4d" font-family="Helvetica, Arial, sans-serif" font-size="19" text-anchor="middle">Entradas numeradas:</text>
  <text x="760.0" y="1653.0" fill="#172b4d" font-family="Helvetica, Arial, sans-serif" font-size="19" text-anchor="middle">0: estado; 1: frame_count</text>
  <text x="760.0" y="1679.0" fill="#172b4d" font-family="Helvetica, Arial, sans-serif" font-size="19" text-anchor="middle">2: causa; 3: perfil activo</text>
  <text x="760.0" y="1705.0" fill="#172b4d" font-family="Helvetica, Arial, sans-serif" font-size="19" text-anchor="middle">4: WIDTH; 5: HEIGHT</text>
  <text x="760.0" y="1731.0" fill="#172b4d" font-family="Helvetica, Arial, sans-serif" font-size="19" text-anchor="middle">Resto: 0</text>
  <rect x="1120" y="1550" width="600" height="220" rx="12" fill="#f3f5f7" stroke="#7a869a" stroke-width="2" stroke-dasharray="none" />
  <text x="1420.0" y="1614.0" fill="#172b4d" font-family="Helvetica, Arial, sans-serif" font-size="19" text-anchor="middle">BUS DE ESTADO</text>
  <text x="1420.0" y="1640.0" fill="#172b4d" font-family="Helvetica, Arial, sans-serif" font-size="19" text-anchor="middle">UC: config_ok, running, stopped</text>
  <text x="1420.0" y="1666.0" fill="#172b4d" font-family="Helvetica, Arial, sans-serif" font-size="19" text-anchor="middle">R_FRAMES[32], R_ERROR[5]</text>
  <text x="1420.0" y="1692.0" fill="#172b4d" font-family="Helvetica, Arial, sans-serif" font-size="19" text-anchor="middle">R_ACTIVE y ROM_META</text>
  <text x="1420.0" y="1718.0" fill="#172b4d" font-family="Helvetica, Arial, sans-serif" font-size="19" text-anchor="middle">Cada entrada extendida a 32 bits</text>
  <rect x="60" y="1950" width="1660" height="270" rx="0" fill="#ffffff" stroke="#7a869a" stroke-width="2" stroke-dasharray="8 6" />
  <text x="890.0" y="2039.0" fill="#172b4d" font-family="Helvetica, Arial, sans-serif" font-size="19" text-anchor="middle">FRONTERA UC ↔ DATAPATH</text>
  <text x="890.0" y="2065.0" fill="#172b4d" font-family="Helvetica, Arial, sans-serif" font-size="19" text-anchor="middle">UC recibe: cfg_match, órdenes CSR, panel_initialized, disponibilidad PHY y condiciones de las otras vistas.</text>
  <text x="890.0" y="2091.0" fill="#172b4d" font-family="Helvetica, Arial, sans-serif" font-size="19" text-anchor="middle">UC genera: START_ACCEPT, config_ok, running, stopped, comandos de fuente/paquete y enables.</text>
  <text x="890.0" y="2117.0" fill="#172b4d" font-family="Helvetica, Arial, sans-serif" font-size="19" text-anchor="middle">APPLY solo valida R_SHADOW. START_ACCEPT captura R_ACTIVE una vez por ejecución; repetir cuadros no lo recarga.</text>
  <text x="890.0" y="2143.0" fill="#172b4d" font-family="Helvetica, Arial, sans-serif" font-size="19" text-anchor="middle">CPU no alimenta bytes RGB. Para esta propuesta, CSR y vídeo comparten clk; otros dominios requieren un puente CDC.</text>
  <text x="495.0" y="328.0" fill="#344563" font-family="Helvetica, Arial, sans-serif" font-size="17" paint-order="stroke" stroke="white" stroke-width="6" stroke-linejoin="round">[10]</text>
  <text x="1040.0" y="328.0" fill="#344563" font-family="Helvetica, Arial, sans-serif" font-size="17" paint-order="stroke" stroke="white" stroke-width="6" stroke-linejoin="round">[10]</text>
  <text x="780.0" y="540.0" fill="#344563" font-family="Helvetica, Arial, sans-serif" font-size="17" paint-order="stroke" stroke="white" stroke-width="6" stroke-linejoin="round">[10]</text>
  <text x="1040.0" y="728.0" fill="#344563" font-family="Helvetica, Arial, sans-serif" font-size="17" paint-order="stroke" stroke="white" stroke-width="6" stroke-linejoin="round">ID [8]</text>
  <text x="1440.0" y="905.0" fill="#344563" font-family="Helvetica, Arial, sans-serif" font-size="17" paint-order="stroke" stroke="white" stroke-width="6" stroke-linejoin="round">WIDTH [16]</text>
  <text x="1040.0" y="1163.0" fill="#344563" font-family="Helvetica, Arial, sans-serif" font-size="17" paint-order="stroke" stroke="white" stroke-width="6" stroke-linejoin="round">WC [16]</text>
  <text x="1040.0" y="1648.0" fill="#344563" font-family="Helvetica, Arial, sans-serif" font-size="17" paint-order="stroke" stroke="white" stroke-width="6" stroke-linejoin="round">[32 × N]</text>
  <text x="495.0" y="1648.0" fill="#344563" font-family="Helvetica, Arial, sans-serif" font-size="17" paint-order="stroke" stroke="white" stroke-width="6" stroke-linejoin="round">[32]</text>
  <text x="910.0" y="1930.0" fill="#344563" font-family="Helvetica, Arial, sans-serif" font-size="17" paint-order="stroke" stroke="white" stroke-width="6" stroke-linejoin="round">START_ACCEPT [1]</text>
</svg>