[workspace]
name = "fpgbc-pantalla"
version = "0.1.0"
description = "Entorno de desarrollo y simulación del motor LPDT"
channels = ["conda-forge", "litex-hub"]
platforms = ["linux-64"]

[dependencies]
make = "*"
iverilog = "12.*"
gtkwave = "*"

[tasks]
test = "make -C motor_lpdt test-all"
sim = "make -C motor_lpdt sim"
wave = "make -C motor_lpdt wave"
